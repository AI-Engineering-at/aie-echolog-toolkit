name: aie-bauteil-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    name: lint + test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black bandit
          if [ -f pyproject.toml ]; then
            pip install -e ".[dev]" 2>/dev/null || pip install -e . 2>/dev/null || true
          fi
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Lint with ruff
        run: ruff check . --output-format=github
        continue-on-error: true

      - name: Check formatting with black
        run: black --check --diff .
        continue-on-error: true

      - name: Security scan with bandit
        run: bandit -r src/ -ll -ii || true
        continue-on-error: true

      - name: Run pytest
        run: |
          if [ -d tests ]; then
            pip install pytest pytest-cov
            pytest tests/ -v --tb=short || echo "::warning::pytest failures detected"
          else
            echo "No tests directory — skipping pytest"
          fi
        continue-on-error: true

  summary:
    name: CI summary
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: always()
    steps:
      - name: Bauteil-CI complete
        run: |
          echo "AIE-Bauteil-CI executed (W83-A baseline)."
          echo "Initial pass: warnings-mode for ruff/black/bandit/pytest."
          echo "Follow-up commits will tighten enforcement per repo maturity."
