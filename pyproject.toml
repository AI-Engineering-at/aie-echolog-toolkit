[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aie-echolog-toolkit"
version = "0.1.0"
description = "MCP-Toolset für echo_log-Persona (Brand-Soul L4) — 10 Tools für Voice + Substrat + Memory + Audit"
requires-python = ">=3.11"
authors = [{ name = "AIE / Joe", email = "noreply@ai-engineering.at" }]
license = { text = "AGPL-3.0-or-later" }
readme = "README.md"
dependencies = [
    "fastmcp>=0.2.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
]

[project.scripts]
aie-echolog-toolkit = "aie_echolog_toolkit.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"
